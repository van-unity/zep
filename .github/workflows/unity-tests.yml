name: Unity EditMode tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Unity ${{ matrix.unity-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        unity-version:
          - 6000.0.79f1
          - 6000.3.19f1
          - 6000.5.7f1

    # UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD are repository secrets (see
    # https://game.ci/docs/github/activation). Pull requests from forks do not
    # receive secrets, so every step below is skipped there and the job passes
    # without running; a maintainer runs the suite before merging.
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Explain the skip
        if: env.UNITY_LICENSE == ''
        run: echo "::notice::Unity license secrets are not available to this run, so the EditMode suite was skipped."

      - name: Check out package
        if: env.UNITY_LICENSE != ''
        uses: actions/checkout@v7

      # The Unity editor image does not fit next to the toolchains the runner
      # ships with; without this the job dies with "No space left on device".
      - name: Free disk space
        if: env.UNITY_LICENSE != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Run package EditMode tests
        id: tests
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@v4
        with:
          packageMode: true
          projectPath: .
          unityVersion: ${{ matrix.unity-version }}
          testMode: EditMode
          artifactsPath: artifacts/${{ matrix.unity-version }}

      - name: Upload test results
        if: always() && env.UNITY_LICENSE != ''
        uses: actions/upload-artifact@v7
        with:
          name: editmode-${{ matrix.unity-version }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
